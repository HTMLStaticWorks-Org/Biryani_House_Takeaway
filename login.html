<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Favicon (Brand Logo Mark) -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="alternate icon" href="assets/images/favicon.svg">
  <link rel="apple-touch-icon" href="assets/images/favicon.svg">
  <title>Customer Login | Biryani House & Takeaway</title>
  <meta name="description" content="Sign in to your Biryani House customer account to track live dum preparations, view order history, and reorder favourite biryanis.">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page-body">

  <!-- Top Right Controls in Dedicated Flex Row (Zero Overlap on Mobile/Tablet/Desktop/RTL) -->
  <div class="auth-topbar-wrapper">
    <div class="auth-top-controls">
      <button class="icon-btn theme-toggle-btn" title="Toggle Theme" aria-label="Toggle Theme">
        <i class="bi bi-moon-stars-fill"></i>
      </button>
      <button class="icon-btn rtl-toggle-btn" title="Toggle RTL Layout" aria-label="Toggle RTL">
        RTL
      </button>
    </div>
  </div>

  <!-- Centered Floating Auth Card -->
  <main class="auth-main-wrap">
    <div class="auth-card-container">
      
      <!-- Card Header -->
      <div class="auth-card-header">
        <a href="index.html" class="auth-brand-badge" title="Go to Biryani House Home">
          <div class="brand-logo-mark" style="width: 44px; height: 44px;">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 9c-.5-1.5 0-3 1-4M24 9.5c0-2 1-3.5 1-4.8M27 9c.5-1.5 0-3-1-4" stroke="#FFC043" stroke-width="1.8" stroke-linecap="round"/>
            <ellipse cx="24" cy="18" rx="14" ry="3.5" fill="#D99A32"/>
            <path d="M21 15.5c1-1.5 5-1.5 6 0" stroke="#FFF4E5" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M10 18c.6 7 5.2 13.5 14 13.5s13.4-6.5 14-13.5H10z" fill="#D99A32"/>
            <path d="M9 19c-3.2 0-5.5 2.2-5.5 5s2.3 5 5.5 5M39 19c3.2 0 5.5 2.2 5.5 5s-2.3 5-5.5 5" stroke="#FFDF9E" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M12 32.5c4 2.8 19 2.8 24 0" stroke="#FFC043" stroke-width="2" stroke-linecap="round"/>
            <path d="M15 35.5h18" stroke="#FFF4E5" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
          </svg>
          </div>
          <span class="auth-brand-title">BIRYANI HOUSE</span>
        </a>
        <h1 class="auth-heading">Welcome Back</h1>
        <p class="auth-subheading">Access your customer dashboard, orders and favourites.</p>
      </div>

      <!-- Error Alert -->
      <div id="loginErrorAlert" class="form-alert error" style="margin-top: 0; margin-bottom: 20px; display: none;"></div>

      <!-- Login Form -->
      <form id="demoLoginForm" class="auth-form" novalidate>
        
        <!-- Email Input with Inner Icon -->
        <div class="auth-input-group">
          <label class="auth-label" for="loginEmail">Email Address</label>
          <div class="auth-field-box">
            <i class="bi bi-envelope auth-field-icon"></i>
            <input type="email" id="loginEmail" class="auth-input" value="customer@example.com" placeholder="name@company.com" required>
          </div>
          <span class="form-error">Please enter your email address.</span>
        </div>

        <!-- Password Input with Inner Lock and Eye Toggle -->
        <div class="auth-input-group">
          <label class="auth-label" for="loginPassword">Password</label>
          <div class="auth-field-box">
            <i class="bi bi-lock auth-field-icon"></i>
            <input type="password" id="loginPassword" class="auth-input" value="demo123" placeholder="••••••••" required>
            <button type="button" class="auth-eye-btn" id="toggleLoginPassword" aria-label="Toggle password visibility">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <span class="form-error">Please enter your password.</span>
        </div>

        <!-- Row: Keep Me Logged In & Forgot Password Link -->
        <div class="auth-options-row">
          <label class="auth-checkbox-label">
            <input type="checkbox" id="rememberMe" checked class="auth-checkbox">
            <span>Keep me logged in</span>
          </label>
          <a href="#forgot" class="auth-link" onclick="alert('Demo reset link: Your password is demo123'); return false;">Forgot password?</a>
        </div>

        <!-- Primary Sign In Button -->
        <button type="submit" class="auth-submit-btn">
          Sign In
        </button>

        <!-- Social Divider -->
        <div class="auth-divider">
          <span>or continue with</span>
        </div>

        <!-- Social Logins (Google & Apple) -->
        <div class="auth-social-row">
          <button type="button" class="auth-social-btn" onclick="quickDemoLogin()">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.9C6.2 7.3 8.9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.2 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.3 14.7c-.2-.7-.4-1.5-.4-2.3 0-.8.1-1.6.4-2.3L1.6 7.2C.6 9.2 0 11.5 0 14s.6 4.8 1.6 6.8l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.3-6.7-5.3L1.6 16c1.9 3.8 5.8 7 10.4 7z"/></svg>
            <span>Google</span>
          </button>

          <button type="button" class="auth-social-btn" onclick="quickDemoLogin()">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M18.7 19.5c-.8 1.2-1.7 2.4-3 2.4-1.3 0-1.7-.8-3.2-.8-1.5 0-2 .8-3.2.8-1.3 0-2.3-1.2-3.1-2.4-1.7-2.4-3-6.8-1.2-9.8.9-1.5 2.5-2.5 4.2-2.5 1.3 0 2.5.9 3.3.9.8 0 2.3-1.1 3.9-.9 1.5.1 2.8.9 3.6 2-3.1 1.7-2.6 6.1.5 7.3-.7 1.1-1.4 2.1-2.2 3.2zM15.4 6.7c.7-.8 1.2-2 1-3.2-1.1.1-2.3.8-3 1.6-.6.7-1.2 1.9-1 3.1 1.2.1 2.3-.7 3-1.5z"/></svg>
            <span>Apple</span>
          </button>
        </div>

        <!-- Footer Switch to Register -->
        <div class="auth-card-footer">
          Don't have an account? <a href="login.html#register" id="switchTabRegister" class="auth-link-bold">Create Account</a>
        </div>

      </form>

      <!-- Register Form (Inline Toggle) -->
      <form id="demoRegisterForm" class="auth-form" style="display: none;" novalidate>
        
        <!-- First Name on its own row -->
        <div class="auth-input-group">
          <label class="auth-label" for="regFirst">First Name</label>
          <div class="auth-field-box">
            <input type="text" id="regFirst" class="auth-input" placeholder="Elena" required style="padding-inline-start: 16px;">
          </div>
        </div>

        <!-- Last Name on its own next row -->
        <div class="auth-input-group">
          <label class="auth-label" for="regLast">Last Name</label>
          <div class="auth-field-box">
            <input type="text" id="regLast" class="auth-input" placeholder="Vance" required style="padding-inline-start: 16px;">
          </div>
        </div>

        <div class="auth-input-group">
          <label class="auth-label" for="regEmail">Email Address</label>
          <div class="auth-field-box">
            <i class="bi bi-envelope auth-field-icon"></i>
            <input type="email" id="regEmail" class="auth-input" placeholder="name@domain.com" required>
          </div>
        </div>

        <!-- Password with Eye Toggle Button -->
        <div class="auth-input-group">
          <label class="auth-label" for="regPassword">Password</label>
          <div class="auth-field-box">
            <i class="bi bi-lock auth-field-icon"></i>
            <input type="password" id="regPassword" class="auth-input" placeholder="Minimum 8 characters" required>
            <button type="button" class="auth-eye-btn" id="toggleRegPassword" aria-label="Toggle password visibility">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="auth-input-group">
          <label class="auth-label" for="regBiryaniPref">Favorite Biryani</label>
          <div class="auth-field-box">
            <select id="regBiryaniPref" class="auth-input" style="cursor: pointer;">
              <option value="chicken">Hyderabadi Chicken Dum Biryani</option>
              <option value="mutton">Royal Mutton Dum Biryani</option>
              <option value="egg">Egg Special Dum Biryani</option>
              <option value="veg">Subz Vegetable Dum Biryani</option>
            </select>
          </div>
        </div>

        <div class="auth-options-row">
          <label class="auth-checkbox-label">
            <input type="checkbox" checked class="auth-checkbox">
            <span>I agree to the <a href="#" class="auth-link">Terms</a> and <a href="#" class="auth-link">Privacy</a>.</span>
          </label>
        </div>

        <button type="submit" class="auth-submit-btn">
          Create Account
        </button>

        <div class="auth-divider">
          <span>or signup with</span>
        </div>

        <div class="auth-social-row">
          <button type="button" class="auth-social-btn" onclick="quickDemoLogin()">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.9C6.2 7.3 8.9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.2 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.3 14.7c-.2-.7-.4-1.5-.4-2.3 0-.8.1-1.6.4-2.3L1.6 7.2C.6 9.2 0 11.5 0 14s.6 4.8 1.6 6.8l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.3-6.7-5.3L1.6 16c1.9 3.8 5.8 7 10.4 7z"/></svg>
            <span>Google</span>
          </button>
          <button type="button" class="auth-social-btn" onclick="quickDemoLogin()">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M18.7 19.5c-.8 1.2-1.7 2.4-3 2.4-1.3 0-1.7-.8-3.2-.8-1.5 0-2 .8-3.2.8-1.3 0-2.3-1.2-3.1-2.4-1.7-2.4-3-6.8-1.2-9.8.9-1.5 2.5-2.5 4.2-2.5 1.3 0 2.5.9 3.3.9.8 0 2.3-1.1 3.9-.9 1.5.1 2.8.9 3.6 2-3.1 1.7-2.6 6.1.5 7.3-.7 1.1-1.4 2.1-2.2 3.2zM15.4 6.7c.7-.8 1.2-2 1-3.2-1.1.1-2.3.8-3 1.6-.6.7-1.2 1.9-1 3.1 1.2.1 2.3-.7 3-1.5z"/></svg>
            <span>Apple</span>
          </button>
        </div>

        <div class="auth-card-footer">
          Already have an account? <a href="login.html#login" id="switchTabLogin" class="auth-link-bold">Sign In</a>
        </div>

      </form>

    </div>
  </main>

  <script src="assets/js/main.js"></script>
  <script>
    // Tab switching between Login and Register
    const loginForm = document.getElementById('demoLoginForm');
    const registerForm = document.getElementById('demoRegisterForm');
    const heading = document.querySelector('.auth-heading');
    const subheading = document.querySelector('.auth-subheading');

    function showRegister() {
      loginForm.style.display = 'none';
      registerForm.style.display = 'flex';
      heading.textContent = 'Create Customer Account';
      subheading.textContent = 'Join 5,000+ biryani lovers enjoying exclusive member privileges.';
      window.location.hash = '#register';
    }

    function showLogin() {
      registerForm.style.display = 'none';
      loginForm.style.display = 'flex';
      heading.textContent = 'Welcome Back';
      subheading.textContent = 'Access your customer dashboard, orders and favourites.';
      window.location.hash = '#login';
    }

    document.getElementById('switchTabRegister')?.addEventListener('click', (e) => {
      e.preventDefault();
      showRegister();
    });

    document.getElementById('switchTabLogin')?.addEventListener('click', (e) => {
      e.preventDefault();
      showLogin();
    });

    if (window.location.hash === '#register') {
      showRegister();
    }

    // Quick demo login function for social buttons
    function quickDemoLogin() {
      localStorage.setItem("bh_logged_in", "true");
      localStorage.setItem("bh_user_name", "Alex Morgan");
      showToast("Logging in with demo profile...");
      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 700);
    }

    // Register password visibility toggle
    const regPassInput = document.getElementById('regPassword');
    const toggleRegPass = document.getElementById('toggleRegPassword');
    if (toggleRegPass && regPassInput) {
      toggleRegPass.addEventListener('click', () => {
        const isPassword = regPassInput.getAttribute('type') === 'password';
        regPassInput.setAttribute('type', isPassword ? 'text' : 'password');
        toggleRegPass.querySelector('i').className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
      });
    }
    registerForm?.addEventListener('submit', (e) => {
      e.preventDefault();
      showToast("Account created successfully! Redirecting...");
      localStorage.setItem("bh_logged_in", "true");
      localStorage.setItem("bh_user_name", document.getElementById('regFirst').value || "Alex Morgan");
      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 800);
    });
  </script>
</body>
</html>
